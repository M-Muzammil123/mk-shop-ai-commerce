[project]
name = "ai-ecommerce-backend"
version = "0.1.0"
description = "FastAPI backend for AI E-Commerce Platform"
authors = [
    { name = "Senior AI Engineer", email = "engineer@example.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.5",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "supabase>=2.4.0",
    "httpx>=0.27.0",
    "psycopg2-binary (>=2.9.12,<3.0.0)"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.14.0",
    "black>=24.2.0",
    "isort>=5.13.2"
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.28.0" }
sqlalchemy = "^2.0.28"
asyncpg = "^0.29.0"
pydantic = { extras = ["email"], version = "^2.6.4" }
pydantic-settings = "^2.2.1"
pyjwt = { extras = ["crypto"], version = "^2.8.0" }
cryptography = "^42.0.5"
bcrypt = "^4.1.2"
python-multipart = "^0.0.9"
supabase = "^2.4.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
pytest-mock = "^3.14.0"
black = "^24.2.0"
isort = "^5.13.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
